<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Registration</h1>
    
    <form>
        <label for="name">Name:</label>
        <br>
        <input type="text" id="name" name="name">

        <br> <br>

        <label for="email">Email:</label>
        <br>
        <input type="text" id="email" name="email">

        <br> <br>

        <label for="phone">Phone:</label>
        <br>
        <input type="tel" id="phone" name="phone">

        <br><br>

        <label for="interests">Options:</label>
        <select name="interests" id="interests">
            <option value="option1">Option1</option>
            <option value="option2">Option2</option>
            <option value="option3">Option3</option>
        </select>

        <br> <br>

            <fieldset style="display: inline-block;">
                <legend>Topics of Interest:</legend>

                <label for="checkbox1">HTML</label>
                <input type="checkbox" name="checkbox" id="checkbox1">

                <label for="checkbox2">CSS</label>
                <input type="checkbox" name="checkbox" id="checkbox2">
    
                <label for="checkbox3">JS</label>
                <input type="checkbox" name="checkbox" id="checkbox3">
            </fieldset>

        <br><br>
        <label for="textarea1">Comments</label>
        <input type="textarea" name="textarea1" id="textarea1">

        <br><br>
        <label for="submit1"></label>
        <input type="submit" id="submit1" name="submit1">

        <br><br>

        <label for="experience">Experience: </label>
        <input type="number" name="experience" id="experience">

    </form>

</body>
</html>
