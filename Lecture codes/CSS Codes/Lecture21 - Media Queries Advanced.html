<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border: solid 5px red;
            background-color: beige;
            display: flex;
            flex-direction: row;
            margin: 2px;
            padding: 10px;
        }
        #boxleft{
            background-color: red;
            border: solid 1px blue;
            display: flex;
            flex-direction: column;
            margin: 2px;
            padding: 10px;
        }
        #boxright{
            background-color: greenyellow;
            border: solid 5px brown;
            margin: 2px;
            padding: 10px;
        }
        p{
            border: 1px dotted black;
        }
        @media (max-width: 640px){
            .container{
                flex-direction: column;
            }
        }
        /* The media query that we added, will make the flex direction as column when we have width less than 640px which means the items will appear one below the other and when the width is more than 640 px we will aply flex direction as row which means that we will align the two text paras and the image in one row. */
    </style>
</head>
<body>
    <div class="container">
        <div id="boxleft">
            <p>Text1</p>
            <p>Text2</p>
        </div>
        <div id="boxright">
            <img src="opimg.jpg" alt="OP IMG" height="200px" width="400px">
        </div>
    </div>
</body>
</html>
