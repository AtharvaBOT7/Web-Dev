<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        div{
            border: 1px solid black;
        }

        img{
            margin: 10px;
        }
        
        .img2{
            position: relative ;
            top: 100px;
            left: 100px; 
        }

        .img1{
            position: fixed;
        }

        .container{
            height: 5000px;
        }

        .box{
            background-color: aqua;
            height: 8000px;
        }

        .img4{
            position: sticky;
            top: 50px;
        }

    </style>

</head>
<body>

    <div class="container">

        <img src="arrow.png" alt="Arrow Image" width="100px" height="100px" class="img1">

        <img src="opimg.jpg" alt="One Piece Image" width="100px" height="100px" class="img2">

        <img src="Straw-Hat-logo.png" alt="Straw Hat Logo" width="100px" height="100px" class="img3">

        <img src="image.jpg" alt="Strawberry" width="100px" height="100px" class="img4">

    </div>

    <div class="box">

    </div>
    
</body>
</html>
