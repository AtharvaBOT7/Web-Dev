<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <div class="card">
            <img src="opimg.jpg" alt="One Piece Image">

            <div class="textBox">
            <h2>Order Summary</h2>

            <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Hic tempora consequatur quos ex suscipit iste aut accusantium reprehenderit temporibus voluptates?</p>
            </div>

            <div id="amountBox">

                <div class="leftBox">
                    <div class="leftImgBox">
                        <img src="Straw-Hat-logo.png" alt="Straw Hat Logo">
                    </div>

                    <div class="textAmtBox">
                        <p>Amount / Year</p>
                        <p>$100</p>
                    </div>
                </div>

                <div class="rightBox">
                    <a href="#">Change</a>
                </div>

            </div>

            <button id="paymentButton">
                Proceed to Pay
            </button>

            <div>
                <a href="#" id="cancelButton">Cancel Order</a>
            </div>
        </div>
    </div>

</body>
</html>
